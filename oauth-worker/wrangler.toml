name = "guia-urubici-cms-oauth"
main = "src/index.ts"
compatibility_date = "2026-10-29"

# -----------------------------------------------------------------------------
# Variavel NAO sensivel (pode ficar no repo). Allowlist de origens que podem
# receber o access_token via postMessage — ver src/index.ts (isAllowedOrigin).
# REVISAR antes do deploy: confirmar o dominio final de producao
# (astro.config.mjs ainda tem `site` como placeholder) e ajustar aqui.
# -----------------------------------------------------------------------------
[vars]
ALLOWED_ORIGINS = "https://novo-guia-urubici.pages.dev,*.novo-guia-urubici.pages.dev"

